name: paper-grammar-tutor

services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "127.0.0.1:${PGT_WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pymupdf-layout:
    build:
      context: .
      dockerfile: docker/pymupdf-layout/Dockerfile
    environment:
      PGT_PADDLE_OCR_URL: http://paddle-ocr:8008
    ports:
      - "127.0.0.1:${PGT_PYMUPDF_PORT:-8009}:8009"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/health', timeout=3).read()"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  paddle-ocr:
    build:
      context: .
      dockerfile: docker/paddle-ocr/Dockerfile
    ports:
      - "127.0.0.1:${PGT_PADDLE_PORT:-8008}:8008"
    volumes:
      - paddle-models:/root/.paddlex
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=5)); assert data.get('status') == 'ok' and data.get('gpuAvailable') is True and data.get('modelLoaded') is True and data.get('device') == 'gpu'"
      interval: 10s
      timeout: 8s
      retries: 180
      start_period: 30s
    restart: unless-stopped

  stanza-syntax:
    build:
      context: .
      dockerfile: docker/stanza-syntax/Dockerfile
    ports:
      - "127.0.0.1:${PGT_STANZA_PORT:-8010}:8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)); assert data.get('status') == 'ok' and data.get('modelReady') is True"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.9
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "127.0.0.1:${PGT_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

volumes:
  paddle-models:
  ollama-models:
