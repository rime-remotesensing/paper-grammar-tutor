server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx 1.29.1's default mime.types maps .js but not .mjs. PDF.js loads its
    # Vite-generated worker as an ES module, so serve that extension explicitly.
    location ~ ^/assets/.*\.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # Missing generated assets are deployment errors, not SPA routes. Never hide
    # them behind index.html, whose text/html response breaks dynamic imports.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
